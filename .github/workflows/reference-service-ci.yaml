name: Reference Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --progress=plain -t reference-service:ci apps/reference-service

      - name: Start application container
        id: start-container
        run: docker run --detach --name reference-service --publish 127.0.0.1:8080:8080 reference-service:ci

      - name: Check application endpoints
        run: |
          curl --fail --silent --show-error --max-time 5 \
            --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/health

          curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:8080/

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: reference-service:ci
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Tag and publish image
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          IMAGE_NAME: ghcr.io/rano1000/reference-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag reference-service:ci "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Show application logs
        if: ${{ always() && steps.start-container.outcome == 'success' }}
        run: docker logs reference-service
