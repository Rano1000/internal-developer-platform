apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reference-service-traffic
  namespace: development
  labels:
    app: reference-service
spec:
  podSelector:
    matchLabels:
      app: reference-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: reference-service
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
